version: 2.1
orbs:
  node: circleci/node@7.2.1
  sonarqube: integromat/sonarqube-orb@2.1.1
jobs:
  test-and-build:
    docker:
      - image: node:24-bookworm
    steps:
      - checkout:
          method: full
      - run:
          command: corepack enable
          name: Enable pnpm
      - node/install-packages:
          pkg-manager: pnpm
          override-ci-command: pnpm install --frozen-lockfile
      - run:
          command: pnpm format:check
          name: Check formatting
      - run:
          command: pnpm lint
          name: Check lint
      - run:
          command: pnpm test:unit
          name: Run unit tests
      - store_artifacts:
          path: coverage/unit
      - store_test_results:
          path: coverage/unit
      - sonarqube/scan
workflows:
  build:
    jobs:
      - test-and-build:
          context:
            - org-default
            - testing
            - sonarqube-prod
