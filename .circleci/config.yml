version: 2.1
orbs:
  sonarqube: integromat/sonarqube-orb@2.1.1
jobs:
  test-and-build:
    docker:
      - image: cimg/node:24.0
    steps:
      - checkout:
          method: full
      - run:
          command: |
            corepack enable
            pnpm install --frozen-lockfile
          name: Install deps
      - run:
          command: pnpm format:check
          name: Check formatting
      - run:
          command: pnpm lint
          name: Check lint
      - run:
          command: pnpm test:unit
          name: Run unit tests
      - store_artifacts:
          path: coverage/unit
      - store_test_results:
          path: coverage/unit
      - sonarqube/scan
workflows:
  build:
    jobs:
      - test-and-build:
          context:
            - org-default
            - testing
            - sonarqube-prod
